name: Unit Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container: gcc:14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run unit tests
        working-directory: projects/nucleo_f446re_sensor_monitor/tests
        run: make test
